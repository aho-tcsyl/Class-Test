<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generative Art Canvas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Generative Art Canvas</h1>
      <p>Algorithmic vector field patterns &bull; Click anywhere on the canvas to warp</p>
    </header>

    <main class="canvas-wrapper">
      <canvas id="generativeCanvas"></canvas>
    </main>

    <footer class="toolbar">
      <div class="button-group">
        <button id="regenerateBtn" class="btn btn-primary">🎲 Generate New</button>
        <button id="toggleAnimBtn" class="btn btn-secondary">▶ Animate</button>
        <button id="downloadBtn" class="btn btn-secondary">💾 Save PNG</button>
      </div>
      <div class="info-tag">
        <span id="paletteLabel">Palette: Neon Cosmic</span>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
